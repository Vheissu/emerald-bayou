<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerald Bayou</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/loading-screen.css">
<style>
  /* Type: Avenir Next Condensed - the condensed sans of hull registration numbers and marina timing boards.
     Colours pulled from the scene: foam white, channel-marker orange, cypress dark, brackish gold. */
  :root { --foam:#f3ede0; --marker:#f07a2e; --cyp:#0f2119; --gold:#e5c063; --ink:rgba(8,20,15,0.72); }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b1512; font-family: "Avenir Next Condensed", "Avenir Next", "Futura", "Gill Sans", sans-serif; color:var(--foam); }
  #app { position:fixed; inset:0; }
  canvas.gl { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; transition:opacity .3s; }
  #hud.dim { opacity:0.12; }
  body:has(#start:not(.hidden)) #hud { opacity:0; }
  #hud {  text-shadow:0 1px 0 rgba(0,0,0,0.6), 0 0 14px rgba(0,0,0,0.45); }
  #minimap { padding:0; border:0; cursor:pointer; pointer-events:auto; position:absolute; left:24px; bottom:22px; width:240px; height:152px; border-radius:8px; overflow:hidden;
    outline:1px solid rgba(239,233,219,.32); background:#32434a; }
  #minimap:focus-visible { outline:3px solid #f6d49b; }
  #hud.dim #minimap { pointer-events:none; }
  #minimap canvas { width:100%; height:100%; display:block; }
  @media (max-width:600px) { #minimap { left:12px; bottom:14px; width:168px; height:106px; } }
  #speed { position:absolute; right:32px; bottom:24px; text-align:right; font-size:14px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.9; }
  #speed b { font-size:44px; line-height:1; letter-spacing:0; display:block; font-weight:600; font-variant-numeric: tabular-nums; }
  #speed .air { display:block; color:var(--gold); font-size:13px; height:16px; }
  #boatState { position:absolute; right:32px; bottom:99px; width:150px; padding:0; opacity:0.93; transition:opacity .25s,border-color .25s; }
  #boatState.warn { opacity:0.96; border-right-color:var(--marker); }
  #boatState .condition-row { display:grid; grid-template-columns:1fr auto; gap:7px; margin:0 0 5px; font-size:10px; letter-spacing:0.13em; text-transform:uppercase; }
  #boatState .condition-row:last-child { margin-bottom:0; }
  #boatState .condition-row b { color:var(--foam); font-size:11px; font-weight:600; }
  #boatState .condition-row i { display:block; grid-column:1 / 3; height:2px; background:rgba(243,237,224,0.16); overflow:hidden; }
  #boatState .condition-row em { display:block; height:100%; background:var(--gold); transition:width .3s; }
  #boatState.warn .condition-row em { background:var(--marker); }
  #waterRule { position:absolute; right:32px; bottom:205px; min-width:190px; text-align:right; text-transform:uppercase; letter-spacing:0.13em; opacity:0; transform:translateX(8px); transition:opacity .2s,transform .2s; }
  #waterRule.on { opacity:0.88; transform:none; }
  #waterRule span { display:block; color:var(--gold); font-size:11px; font-weight:650; }
  #waterRule small { display:block; margin-top:4px; color:var(--foam); font-size:9px; opacity:0.7; letter-spacing:0.08em; }
  #waterRule.warn { opacity:1; }
  #waterRule.warn span { color:var(--marker); text-shadow:0 0 10px rgba(240,122,46,0.42); }
  #servicePrompt { position:absolute; left:50%; bottom:116px; transform:translateX(-50%); font-size:13px; letter-spacing:0.13em; text-transform:uppercase; white-space:nowrap; opacity:0; transition:opacity .2s; }
  #servicePrompt.on { opacity:0.86; }
  #servicePrompt b { color:var(--gold); font-size:15px; margin-right:8px; }
  /* mission panel */
  #mission { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); width:min(570px,52vw); text-align:center; }
  #mission:empty, #boatState:empty { display:none; }
  #mission .title { color:#efca88; font-size:13px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; }
  #mission .obj { margin-top:3px; font:600 clamp(16px,1.25vw,21px)/1.22 "Avenir Next",sans-serif; text-wrap:balance; }
  #mission .sub { margin-top:3px; font:500 13px/1.25 "Avenir Next",sans-serif; color:#e4e4dc; }
  #timer { position:absolute; left:50%; top:22px; transform:translateX(-50%); text-align:center; font-size:38px; font-weight:600; font-variant-numeric: tabular-nums; letter-spacing:0.02em; }
  #timer.warn { color:var(--marker); }
  #timer small { display:block; font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; opacity:0.8; }
  #wp { position:absolute; left:50%; top:100px; transform:translateX(-50%); font-size:15px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.85; white-space:nowrap; }
  #wp b { color:var(--marker); font-weight:600; }
  #lawState { position:absolute; right:28px; top:24px; min-width:170px; text-align:right; text-transform:uppercase; letter-spacing:0.14em; opacity:0; transform:translateX(8px); transition:opacity .25s,transform .25s; }
  #lawState.on { opacity:0.92; transform:none; }
  #lawState > span { display:block; color:#8fb8d8; font-size:10px; font-weight:600; }
  #lawState > b { display:flex; justify-content:flex-end; gap:3px; margin-top:3px; }
  #lawState > b i { width:17px; color:rgba(143,184,216,0.2); font-size:17px; font-style:normal; line-height:1; text-align:center; text-shadow:none; }
  #lawState > b i.lit { color:#a8d5f5; text-shadow:0 0 9px rgba(85,155,230,0.76); }
  #lawState.pursuit > span,#lawState.pursuit > b i.lit { color:#f0f6fa; }
  #lawState.pursuit > b i.lit { animation:wantedPulse .55s steps(2,end) infinite; text-shadow:0 0 12px rgba(70,145,255,0.95),0 0 4px rgba(255,55,45,0.72); }
  @keyframes wantedPulse { 50% { opacity:.58; } }
  #lawState small { display:block; margin-top:5px; max-width:240px; color:var(--foam); font-size:9px; opacity:0.68; letter-spacing:0.09em; }
  #hazardState { position:absolute; right:28px; top:100px; min-width:190px; text-align:right; text-transform:uppercase; letter-spacing:0.14em; opacity:0; transform:translateX(8px); transition:opacity .2s,transform .2s; }
  #hazardState.on { opacity:0.96; transform:none; }
  #hazardState span { display:block; color:#d7f1f4; font-size:11px; font-weight:650; text-shadow:0 0 12px rgba(190,240,255,0.45); }
  #hazardState small { display:block; margin-top:4px; color:var(--foam); font-size:9px; opacity:0.72; letter-spacing:0.08em; }
  #fireState { position:absolute; right:28px; top:155px; min-width:220px; text-align:right; text-transform:uppercase; letter-spacing:0.14em; opacity:0; transform:translateX(8px); transition:opacity .2s,transform .2s; }
  #fireState.on { opacity:0.96; transform:none; }
  #fireState span { display:block; color:#ff8a4d; font-size:11px; font-weight:700; text-shadow:0 0 14px rgba(255,78,22,0.62); }
  #fireState small { display:block; margin-top:4px; color:var(--foam); font-size:9px; opacity:0.76; letter-spacing:0.08em; }
  #memoryState { position:absolute; left:28px; bottom:190px; width:270px; padding-left:10px; border-left:2px solid rgba(229,192,99,0.45); text-transform:uppercase; letter-spacing:0.12em; opacity:0; transform:translateX(-8px); transition:opacity .24s,transform .24s; }
  #memoryState.on { opacity:0.92; transform:none; }
  #memoryState span { display:block; color:var(--gold); font-size:10px; font-weight:650; }
  #memoryState small { display:block; margin-top:4px; color:var(--foam); font-size:10px; line-height:1.35; opacity:0.78; letter-spacing:0.055em; }
  #weatherAlert { position:absolute; left:50%; top:17%; transform:translate(-50%,-10px); min-width:300px; max-width:min(560px,70vw); padding:11px 18px 12px;
    border-top:1px solid rgba(243,237,224,0.48); border-bottom:1px solid rgba(243,237,224,0.18); background:linear-gradient(90deg,transparent,rgba(5,14,11,0.78) 12%,rgba(5,14,11,0.78) 88%,transparent);
    text-align:center; font-size:15px; letter-spacing:0.035em; opacity:0; transition:opacity .3s, transform .3s; }
  #weatherAlert span { display:block; margin-bottom:3px; color:var(--gold); font-size:12px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; }
  #weatherAlert.on { opacity:1; transform:translate(-50%,0); }
  #regionState { position:absolute; left:50%; top:28%; transform:translate(-50%,9px); min-width:360px; text-align:center; text-transform:uppercase; opacity:0; transition:opacity .55s,transform .55s; }
  #regionState.on { opacity:0.94; transform:translate(-50%,0); }
  #regionState span { display:block; font-size:29px; font-weight:600; letter-spacing:0.2em; line-height:1; text-shadow:0 2px 2px rgba(0,0,0,0.76),0 0 22px rgba(0,0,0,0.68); }
  #regionState small { display:block; width:max-content; max-width:70vw; margin:9px auto 0; padding:7px 14px 3px; border-top:1px solid rgba(243,237,224,0.42); background:linear-gradient(90deg,transparent,rgba(5,14,11,0.34) 18%,rgba(5,14,11,0.34) 82%,transparent); font-size:11px; letter-spacing:0.18em; opacity:0.84; text-shadow:0 1px 2px rgba(0,0,0,0.8),0 0 12px rgba(0,0,0,0.65); }
  #radioState { position:absolute; top:28px; left:28px; max-width:min(350px,44vw); padding:9px 13px; background:rgba(13,26,24,.78); border-left:3px solid #b6ad83; opacity:0; transform:translateY(-6px); transition:opacity .18s,transform .18s; }
  #radioState.on { opacity:1; transform:none; }
  #radioState .radio-meta { font-size:11px; line-height:1.2; letter-spacing:.08em; color:#d8c897; }
  #radioState .radio-meta i { display:none; }
  #radioState > b { display:block; margin-top:3px; font-size:13px; letter-spacing:.04em; }
  #radioState p { margin:3px 0 0; font:500 14px/1.35 "Avenir Next",sans-serif; }
  #radioState.urgent { border-color:#ee9869; }
  /* trick feed */
  #tricks { position:absolute; right:32px; top:34%; text-align:right; }
  #tricks .ev { font-size:20px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; animation: pop .25s ease-out; }
  #tricks .ev span { color:var(--gold); margin-left:10px; font-weight:500; }
  #tricks .ev.bust { color:var(--marker); }
  #tricks .chain { font-size:15px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.85; margin-top:6px; }
  #tricks .chain b { color:var(--gold); font-size:22px; }
  @keyframes pop { from { transform:translateX(24px) scale(0.9); opacity:0 } to { transform:none; opacity:1 } }
  /* screen-edge waypoint arrow */
  #arrow { position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; }
  #arrow div { position:absolute; left:-14px; top:-14px; width:28px; height:28px; border-radius:50%; background:var(--marker); box-shadow:0 0 0 2px rgba(0,0,0,0.5); transform-origin:center; }
  #arrow div::after { content:""; position:absolute; left:9px; top:-9px; border:6px solid transparent; border-bottom:9px solid var(--marker); border-top:none; }
  #arrow .dist { position:absolute; top:18px; left:-40px; width:80px; text-align:center; font-size:13px; letter-spacing:0.08em; }
  /* centre toasts */
  #toast { position:absolute; left:50%; top:16%; transform:translateX(-50%); text-align:center; width:min(560px,72vw); font-size:26px; line-height:1.05; font-weight:650; opacity:0; transition:opacity .25s; }
  #toast.on { opacity:1; }
  #toast small { display:block; font:500 15px/1.35 "Avenir Next",sans-serif; margin-top:5px; text-wrap:balance; }
  /* bounty completions: a quiet line above the minimap */
  #bounty { position:absolute; right:28px; bottom:230px; text-align:right; font-size:16px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); opacity:0; transition:opacity .3s; white-space:nowrap; }
  #bounty.on { opacity:1; }
  #bounty b { color:var(--foam); margin-left:8px; }
  /* dock prompt */
  #prompt { position:absolute; left:50%; bottom:78px; transform:translateX(-50%); font-size:17px; letter-spacing:0.12em; text-transform:uppercase; white-space:nowrap; opacity:0; transition:opacity .2s; }
  #prompt.on { opacity:1; }
  #prompt b, #servicePrompt b { display:inline-grid; place-items:center; padding:1px 5px; min-width:14px; color:#182824; background:#efece2; border-radius:2px; text-shadow:none; margin-right:5px; }
  #prompt i { font-style:normal; opacity:0.7; text-transform:none; letter-spacing:0.04em; }
  /* the chart */
  #bigmap { position:fixed; inset:0; z-index:5; display:grid; grid-template-rows:auto minmax(0,1fr) auto; background:#182329; }
  #bigmap.hidden { display:none; }
  #bigmapView { position:relative; min-width:0; overflow:hidden; }
  #bigmap canvas { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  #bigmap canvas:active { cursor:grabbing; }
  #bigmap canvas:focus-visible { outline:2px solid rgba(243,237,224,.5); outline-offset:-2px; }
  #bigmap header, #bigmap footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px max(14px, env(safe-area-inset-left)); }
  #bigmap header { border-bottom:1px solid rgba(243,237,224,.23); }
  #bigmap footer { border-top:1px solid rgba(243,237,224,.23); padding-bottom:max(9px, env(safe-area-inset-bottom)); }
  #bigmap h2 { margin:0; font-size:22px; line-height:1.1; font-weight:650; }
  #bigmapLegend, #bigmap footer p { color:#c5cecc; font-size:14px; margin:0; }
  #bigmapRoute { min-width:0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  #bigmapRouteName { font-size:17px; }
  #bigmapRouteDetail { font-size:15px; color:#ff9489; font-variant-numeric:tabular-nums; }
  #bigmap footer div { display:flex; gap:6px; flex-wrap:wrap; }
  #bigmap button { cursor:pointer; border:1px solid rgba(243,237,224,.32); border-radius:3px; background:#26363e; color:var(--foam); padding:4px 10px; min-height:34px; }
  #bigmap button:hover, #bigmap button:focus-visible { border-color:var(--foam); }
  #bigmap button:disabled { opacity:.42; cursor:default; }
  @media (max-width:600px) {
    #bigmap header, #bigmap footer { flex-wrap:wrap; gap:6px 12px; }
    #bigmapRoute { order:2; flex-basis:100%; }
    #bigmap footer p { display:none; }
  }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .4s; z-index:4; }
  #fade.on { opacity:1; }
  /* overlays */
  button { font:inherit; }
  [hidden] { display:none !important; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; visibility:visible;
    background:linear-gradient(90deg, rgba(6,18,14,0.9) 0%, rgba(6,18,14,0.55) 60%, rgba(6,18,14,0.3) 100%); color:var(--foam); transition:opacity .35s,visibility 0s; z-index:5; }
  .overlay.hidden { opacity:0; pointer-events:none; visibility:hidden; transition:opacity .35s,visibility 0s .35s; }
  .input-gamepad { display:none; }
  html[data-input="gamepad"] .input-keyboard { display:none; }
  html[data-input="gamepad"] .input-gamepad { display:inline; }
  /* full pause shell: DOM only, so opening it does not allocate another 3D scene */
  #menu { box-sizing:border-box; display:grid; grid-template-columns:96px minmax(0,1fr); grid-template-rows:minmax(0,1fr) 58px; padding:0; gap:0; overflow:hidden; background:linear-gradient(90deg,rgba(3,10,8,0.96) 0%,rgba(3,10,8,0.88) 48%,rgba(3,10,8,0.56) 100%); }
  #menu:focus { outline:none; }
  #menu .menu-rail { grid-row:1 / 3; display:flex; flex-direction:column; align-items:stretch; padding:23px 10px 16px; border-right:1px solid rgba(243,237,224,.13); background:rgba(4,13,10,.55); }
  #menu .rail-mark { display:grid; place-items:center; width:42px; height:42px; margin:0 auto 27px; border:1px solid rgba(229,192,99,.55); color:var(--gold); font-size:17px; font-weight:700; letter-spacing:.05em; }
  #menu .rail-tab { appearance:none; min-height:61px; padding:8px 4px; border:0; border-left:3px solid transparent; background:transparent; color:rgba(243,237,224,.48); cursor:pointer; font-size:10px; font-weight:650; letter-spacing:.13em; text-transform:uppercase; transition:background .15s,color .15s,border-color .15s; }
  #menu .rail-tab span { display:block; margin-bottom:5px; font-size:17px; letter-spacing:0; }
  #menu .rail-tab:hover, #menu .rail-tab:focus-visible { outline:none; color:var(--foam); background:rgba(243,237,224,.06); }
  #menu .rail-tab.active { border-left-color:var(--marker); color:var(--foam); background:rgba(243,237,224,.09); }
  #menu .rail-status { margin-top:auto; padding:10px 3px 0; color:var(--gold); font-size:9px; line-height:1.5; letter-spacing:.12em; text-align:center; text-transform:uppercase; }
  #menu .menu-stage { min-width:0; overflow:auto; padding:clamp(30px,5vh,58px) clamp(30px,5vw,74px) 30px; scrollbar-width:thin; scrollbar-color:rgba(243,237,224,.22) transparent; }
  #menu .menu-view { width:min(1220px,100%); margin:0 auto; }
  #menu .menu-head { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,400px); gap:32px; align-items:end; margin-bottom:27px; padding-bottom:17px; border-bottom:1px solid rgba(243,237,224,.2); }
  #menu .menu-head > div > p { margin:0 0 7px; color:var(--gold); font-size:10px; font-weight:650; letter-spacing:.28em; text-transform:uppercase; }
  #menu h1 { font-size:clamp(35px,4.2vw,61px); letter-spacing:.1em; }
  #menu .menu-head .menu-copy { margin:0; font-family:"Avenir Next","Futura",sans-serif; font-size:14px; line-height:1.5; opacity:.68; }
  #menu .menu-grid { display:grid; grid-template-columns:minmax(420px,1.65fr) minmax(270px,.8fr); gap:clamp(28px,4vw,58px); align-items:start; }
  #menu .list { display:flex; flex-direction:column; gap:2px; max-height:calc(100vh - 280px); overflow-y:auto; padding-right:10px; scrollbar-width:thin; scrollbar-color:rgba(243,237,224,0.22) transparent; }
  #menu .list::-webkit-scrollbar { width:4px; }
  #menu .list::-webkit-scrollbar-thumb { background:rgba(243,237,224,0.22); }
  #menu .list::-webkit-scrollbar-track { background:transparent; }
  #menu .m { appearance:none; display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:baseline; width:100%; padding:8px 12px; border:0; border-left:3px solid transparent; background:rgba(4,13,10,.22); color:var(--foam); text-align:left; cursor:pointer; }
  #menu .m:hover, #menu .m:focus-visible, #menu .m.sel { outline:none; background:rgba(243,237,224,0.08); border-left-color:var(--marker); }
  #menu .m.locked { opacity:0.38; cursor:default; }
  #menu .m .n { font-size:16px; opacity:0.6; font-variant-numeric: tabular-nums; }
  #menu .m .t { font-size:21px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  #menu .m .d { font-size:14px; opacity:0.8; grid-column:2 / 4; display:none; line-height:1.35; padding-bottom:4px; }
  #menu .m .d em { font-style:normal; display:block; color:var(--gold); letter-spacing:0.1em; text-transform:uppercase; font-size:12px; margin-top:3px; }
  #menu .m.sel .d { display:block; }
  #menu .m .best { font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); text-align:right; white-space:nowrap; }
  #menu .m .best i { font-style:normal; margin-left:8px; opacity:0.7; color:var(--foam); }
  #menu .m.done .n { color:var(--gold); opacity:1; }
  #menu .foot { margin-top:14px; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.58; }
  #menu .stats { margin-top:16px; padding-top:13px; border-top:1px solid rgba(243,237,224,.12); font-size:15px; letter-spacing:0.08em; }
  #menu .stats b { color:var(--gold); }
  #menu .stats .world { display:block; margin-top:5px; font-size:13px; opacity:0.78; text-transform:uppercase; letter-spacing:0.13em; }
  #menu .menu-card { margin-bottom:18px; padding:17px 18px; border-top:2px solid rgba(229,192,99,.46); background:rgba(4,13,10,.4); }
  #menu .menu-card .h { margin:0 0 11px; padding-bottom:8px; border-bottom:1px solid rgba(243,237,224,0.18); font-size:11px; font-weight:650; letter-spacing:.22em; text-transform:uppercase; opacity:.74; }
  #menu .b { display:grid; grid-template-columns: 18px 1fr auto; gap:8px; padding:5px 0; font-size:15px; align-items:baseline; }
  #menu .b .chk { color:var(--gold); }
  #menu .b .bt i { font-style:normal; opacity:0.6; }
  #menu .b .pay { color:var(--gold); font-variant-numeric: tabular-nums; }
  #menu .b.done { opacity:0.5; }
  #menu .b.done .bt { text-decoration:line-through; }
  #menu .r { display:flex; justify-content:space-between; padding:4px 0; font-size:15px; }
  #menu .r b { color:var(--gold); font-weight:600; font-variant-numeric: tabular-nums; }
  #menu .keys { font-size:13px; line-height:1.7; opacity:0.75; letter-spacing:0.04em; }
  #menu .world-grid, #menu .records-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  #menu .world-grid .menu-card, #menu .records-grid .menu-card { margin:0; min-width:0; }
  #menu .world-grid .field-notes { grid-column:1/-1; }
  #menu .records-grid .fishing-log { grid-column:1/-1; }
  #menu .field-note-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 20px; }
  #menu .fish-log-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 20px; }
  #menu .field-note-grid .deed { opacity:.55; }
  #menu .field-note-grid .deed.found { opacity:.92; }
  #menu .fish-log-grid .deed { opacity:.55; }
  #menu .fish-log-grid .deed.found { opacity:.92; }
  #menu .kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:rgba(243,237,224,.1); }
  #menu .kpi { padding:16px 13px; background:rgba(4,13,10,.82); }
  #menu .kpi b { display:block; color:var(--gold); font-size:25px; font-weight:600; font-variant-numeric:tabular-nums; }
  #menu .kpi span { display:block; margin-top:4px; font-size:9px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  #menu .standing { display:grid; grid-template-columns:112px 1fr auto; gap:10px; padding:8px 0; border-bottom:1px solid rgba(243,237,224,.08); font-size:14px; }
  #menu .standing:last-child { border-bottom:0; }
  #menu .standing span { text-transform:uppercase; letter-spacing:.1em; opacity:.62; }
  #menu .standing b { color:var(--gold); font-weight:600; }
  #menu .standing em { align-self:center; color:var(--foam); font-size:12px; font-style:normal; font-variant-numeric:tabular-nums; opacity:.55; }
  #menu .deed { padding:8px 0; border-bottom:1px solid rgba(243,237,224,.08); font-family:"Avenir Next","Futura",sans-serif; font-size:13px; line-height:1.4; opacity:.78; }
  #menu .deed:last-child { border-bottom:0; }
  #menu .deed b { margin-right:8px; color:var(--gold); font-family:"Avenir Next Condensed","Avenir Next",sans-serif; font-size:10px; letter-spacing:.13em; text-transform:uppercase; }
  #menu .system-list { width:min(760px,100%); }
  #menu .system-action { appearance:none; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; width:100%; padding:16px 17px; border:0; border-left:3px solid transparent; border-bottom:1px solid rgba(243,237,224,.1); background:rgba(4,13,10,.36); color:var(--foam); text-align:left; cursor:pointer; }
  #menu .system-action:hover, #menu .system-action:focus-visible, #menu .system-action.sel { outline:none; border-left-color:var(--marker); background:rgba(243,237,224,.09); }
  #menu .system-action.danger { border-left-color:#d45642; background:rgba(80,25,18,.42); }
  #menu .system-action strong { font-size:17px; letter-spacing:.14em; text-transform:uppercase; }
  #menu .system-action small { grid-column:1; margin-top:-11px; font-family:"Avenir Next","Futura",sans-serif; font-size:12px; line-height:1.4; opacity:.58; }
  #menu .system-action em { grid-column:2; grid-row:1 / 3; align-self:center; color:var(--gold); font-size:12px; font-style:normal; letter-spacing:.12em; text-transform:uppercase; }
  #menu .menu-keybar { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 clamp(30px,5vw,74px); border-top:1px solid rgba(243,237,224,.13); background:rgba(4,13,10,.72); font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.72; }
  #menu .menu-keybar > .input-keyboard { display:flex; }
  #menu .menu-keybar > .input-gamepad { display:none; }
  #menu .menu-keybar > .input-keyboard, #menu .menu-keybar > .input-gamepad { width:100%; align-items:center; justify-content:space-between; gap:20px; }
  html[data-input="gamepad"] #menu .menu-keybar > .input-keyboard { display:none; }
  html[data-input="gamepad"] #menu .menu-keybar > .input-gamepad { display:flex; }
  #menu .menu-keybar b { color:var(--gold); font-weight:650; }
  /* results */
  #result { text-align:center; }
  #result h2 { font-size:48px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; margin:0; }
  #result h2.fail { color:var(--marker); }
  #result .lines { font-size:18px; line-height:1.6; opacity:0.9; }
  #result .lines b { color:var(--gold); }
  #result .foot { margin-top:18px; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.7; }
  @media (max-width:900px) {
    #menu { grid-template-columns:1fr; grid-template-rows:66px minmax(0,1fr) 52px; }
    #menu .menu-rail { grid-row:1; flex-direction:row; align-items:stretch; padding:7px 10px; border-right:0; border-bottom:1px solid rgba(243,237,224,.13); }
    #menu .rail-mark { width:42px; height:42px; margin:5px 14px 0 0; flex:0 0 auto; }
    #menu .rail-tab { min-height:0; min-width:74px; padding:5px 9px; border-left:0; border-bottom:3px solid transparent; }
    #menu .rail-tab.active { border-left:0; border-bottom-color:var(--marker); }
    #menu .rail-status { margin:0 0 0 auto; padding:13px 6px 0; }
    #menu .menu-stage { grid-row:2; padding:28px 28px 22px; }
    #menu .menu-keybar { grid-row:3; padding:0 28px; }
    #menu .list { max-height:none; }
  }
  @media (max-width:760px) {
    #menu .rail-mark, #menu .rail-status { display:none; }
    #menu .menu-rail { justify-content:space-between; padding:7px 5px; }
    #menu .rail-tab { min-width:0; flex:1; font-size:9px; letter-spacing:.08em; }
    #menu .menu-stage { padding:22px 18px 18px; }
    #menu .menu-head { display:block; margin-bottom:18px; }
    #menu .menu-head .menu-copy { margin-top:10px; }
    #menu .menu-grid, #menu .world-grid, #menu .records-grid { grid-template-columns:1fr; gap:18px; }
    #menu .field-note-grid { grid-template-columns:1fr; }
    #menu .fish-log-grid { grid-template-columns:1fr; }
    #menu .m { grid-template-columns:24px 1fr; }
    #menu .m .best { grid-column:2; text-align:left; }
    #menu .m .d { grid-column:2; }
    #menu .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
    #menu .menu-keybar { padding:0 16px; font-size:9px; }
    #menu .menu-keybar > span > span:last-child { display:none; }
    #fireState { right:18px; }
    #waterRule { right:18px; bottom:200px; }
    #regionState { top:24%; min-width:280px; }
    #regionState span { font-size:22px; }
    #radioState { left:18px; top:142px; width:calc(100vw - 36px); }
    #radioState p { font-size:13px; }
  }
  #hud { text-shadow:0 1px 3px #111e17, 0 1px 5px rgba(0,0,0,.6); }
  #speed { display:flex; gap:4px; align-items:baseline; font-size:11px; }
  #speed .air { position:absolute; bottom:100%; right:0; white-space:nowrap; }
  #boatState { bottom:123px; }
  #waterRule { bottom:75px; min-width:0; }
  #waterRule small { display:none; }
  #timer small, #prompt, #servicePrompt { letter-spacing:.035em; text-transform:none; }
  #prompt, #servicePrompt { font-size:15px; max-width:calc(100vw - 32px); text-align:center; white-space:normal; }
  #prompt { bottom:98px; }
  #servicePrompt { bottom:127px; }
  #wp { top:auto; left:24px; bottom:178px; transform:none; text-align:left; max-width:240px; overflow:hidden; text-overflow:ellipsis; text-transform:none; letter-spacing:.02em; font-size:15px; font-weight:600; }
  #wp b { display:none; }
  #hud:has(#wp:not(:empty)) #regionState { opacity:0; }
  #regionState { left:28px; top:auto; bottom:185px; min-width:0; text-align:left; transform:translateY(4px); }
  #regionState.on { transform:none; }
  #regionState span { font-size:19px; letter-spacing:.035em; text-shadow:0 1px 4px #15251f; }
  #regionState small { display:none; }
  @media (max-width:600px) { #wp, #regionState { left:12px; bottom:125px; max-width:168px; } }
  #hud:has(#memoryState.on) #regionState { opacity:0; }
  #hud:has(#mission:not(:empty)) #toast { top:11%; }
  @media (max-width:720px) {
    #mission { bottom:155px; width:85vw; }
    #prompt { bottom:215px; } #servicePrompt { bottom:241px; }
    #speed { right:14px; bottom:16px; } #speed b { font-size:34px; }
    #radioState { left:12px; top:12px; }
    #bounty { right:14px; bottom:95px; max-width:44vw; white-space:normal; }
  }
</style>
<link rel="stylesheet" href="/src/menu-screen.css">
<link rel="stylesheet" href="/src/boat-shop.css">
</head>
<body>
<div id="app"></div>
<div id="hud">
  <button type="button" id="minimap" aria-label="Open chart" title="Open chart (Tab)"><canvas id="minimapCanvas" width="480" height="304" aria-hidden="true"></canvas></button>
  <div id="speed"><span class="air" id="airVal"></span><b id="speedVal">0</b>mph</div>
  <div id="mission"></div>
  <div id="timer"></div>
  <div id="wp"></div>
  <div id="lawState"></div>
  <div id="hazardState"></div>
  <div id="fireState" role="status" aria-live="polite"></div>
  <div id="memoryState"></div>
  <div id="boatState"></div>
  <div id="waterRule" role="status" aria-live="polite"></div>
  <div id="tricks"></div>
  <div id="arrow" style="display:none"><div></div><span class="dist"></span></div>
  <div id="toast"></div>
  <div id="bounty"></div>
  <div id="prompt"></div>
  <div id="servicePrompt"></div>
  <div id="weatherAlert"></div>
  <div id="regionState"></div>
  <div id="radioState" role="status" aria-live="polite"></div>
</div>
<section id="bigmap" class="hidden" aria-labelledby="chartTitle">
  <header>
    <div><h2 id="chartTitle">Chart</h2><div id="bigmapLegend"></div></div>
    <div id="bigmapRoute"><strong id="bigmapRouteName"></strong><span id="bigmapRouteDetail"></span></div>
    <button id="chartClose" type="button">Close</button>
  </header>
  <div id="bigmapView"><canvas id="bigmapCanvas" tabindex="-1" aria-label="Waterway chart. Arrow keys pan. Enter places a pin at the centre. Delete clears the pin."></canvas></div>
  <footer>
    <p>Click to pin · Drag to pan · Scroll to zoom</p>
    <div>
      <button type="button" id="chartZoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="chartZoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="chartPin">Pin centre</button>
      <button type="button" id="chartFrame" disabled>Show route</button>
      <button type="button" id="chartClear" disabled>Clear pin</button>
    </div>
  </footer>
</section>
<div id="fade"></div>
<div id="loading">
  <img class="loading-art loading-art-a" alt="" aria-hidden="true" decoding="async">
  <img class="loading-art loading-art-b" alt="" aria-hidden="true" decoding="async">
  <div class="loading-ui">
    <div class="loading-brand" aria-label="Emerald Bayou">
      <span class="loading-wordmark">Emerald</span>
      <span class="loading-line" aria-hidden="true">Bayou</span>
    </div>
    <div class="loading-progress" role="status" aria-live="polite">
      <div class="loading-status">
        <span id="loadtext" class="screen-reader-only">Loading</span>
      </div>
      <div id="loadtrack" class="bar" role="progressbar" aria-label="Loading Emerald Bayou" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <button id="loadRetry" type="button" hidden>Retry</button>
    </div>
  </div>
</div>
<div id="start" class="overlay hidden" aria-hidden="true">
  <div class="start-panel">
    <h1>Emerald <em>Bayou</em></h1>
  </div>
  <nav class="title-actions" aria-label="Main menu">
    <button type="button" class="title-action primary" id="titlePrimary" data-title-action="continue"><span class="action-name">Play</span></button>
    <button type="button" class="title-action" data-title-action="jobs"><span class="action-name">Jobs</span></button>
    <button type="button" class="title-action" id="titleNew" data-title-action="new" hidden><span class="action-name">New game</span></button>
    <button type="button" class="title-action" data-title-action="graphics"><span class="action-name">Graphics</span><span class="title-setting" id="titleGraphicsDetail">Auto</span></button>
  </nav>
</div>
<div id="menu" class="overlay hidden" tabindex="-1" aria-hidden="true"></div>
<div id="result" class="overlay hidden"></div>
<script type="module" src="/src/bootstrap.js"></script>
</body>
</html>
