name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production models
        env:
          MODEL_ARCHIVE: ${{ runner.temp }}/emerald-bayou-models.zip
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Vheissu/emerald-bayou/releases/download/v0.1.0/emerald-bayou-models.zip \
            --output "$MODEL_ARCHIVE"
          echo "60e5617bbda40b7e9641f53da86edf90b404926fd3cf75859470eadc9359d10b  $MODEL_ARCHIVE" | sha256sum --check
          mkdir -p public/models
          unzip -q "$MODEL_ARCHIVE" -d public/models

      - name: Build game
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
